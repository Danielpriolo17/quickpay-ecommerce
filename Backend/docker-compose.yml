services:
  postgres:
    image: postgres:16-alpine
    container_name: checkout_postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_DB: checkout_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: